name: Build Local AETHAS38

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  IMAGE_NAME: multi-ia-codage

jobs:
  build-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Compilation directe sur le serveur hôte (sans cache)
        run: |
          # Détermination dynamique du tag (version Git ou 'latest')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            docker build --no-cache -t ${{ env.IMAGE_NAME }}:${VERSION} -t ${{ env.IMAGE_NAME }}:latest .
          else
            docker build --no-cache -t ${{ env.IMAGE_NAME }}:latest .
          fi

      - name: Redéploiement automatique du conteneur
        run: |
          # Si le chemin de votre stack est sur le RAID, met à jour et recrée le service
          if [ -d "/mnt/stockage_raid/AppData/MULTI-IA-AETHAS38" ]; then
            cd /mnt/stockage_raid/AppData/MULTI-IA-AETHAS38
            docker compose up -d --force-recreate
          fi
          
          # Nettoyage des images orphelines
          docker image prune -f