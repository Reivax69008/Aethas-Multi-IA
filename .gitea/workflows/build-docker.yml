name: Build & Push Local Gitea Registry

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: 192.168.1.20:3000
  IMAGE_NAME: xavier/multi-ia-codage

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Connexion et Push direct sur le registre Gitea local
        run: |
          # 1. Connexion au registre HTTP local via le client Docker natif de l'hôte
          echo "${{ secrets.GITEA_TOKEN || gitea.token }}" | docker login ${{ env.REGISTRY }} -u ${{ gitea.actor }} --password-stdin

          # 2. Détermination dynamique du tag (version Git ou 'latest')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGGED_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
            LATEST_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            
            docker build --no-cache -t ${TAGGED_IMAGE} -t ${LATEST_IMAGE} .
            docker push ${TAGGED_IMAGE}
            docker push ${LATEST_IMAGE}
          else
            LATEST_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            
            docker build --no-cache -t ${LATEST_IMAGE} .
            docker push ${LATEST_IMAGE}
          fi

      - name: Nettoyage des images locales sur le serveur
        run: |
          docker image prune -f