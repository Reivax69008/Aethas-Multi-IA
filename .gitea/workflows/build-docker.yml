name: Test, Build & Deploy Local AETHAS38

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  IMAGE_NAME: multi-ia-codage

jobs:
  build-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Validation syntaxique Backend Python & Frontend HTML (Point 1)
        run: |
          python3 -m py_compile backend/*.py
          python3 -c "import glob, sys; files = glob.glob('frontend/*.html'); [sys.exit(f'Erreur HTML dans {f}: balise <{t}> non équilibrée') for f in files for c in [open(f, encoding='utf-8').read()] for t in ['html','head','body','script','style','div','main','aside','header','table','select','textarea'] if c.count(f'<{t}') != c.count(f'</{t}>')]"
          echo "✅ Code Backend (.py) et Frontend (.html) 100% valides !"

      - name: Compilation incrémentale sur le serveur hôte (Cache Docker actif)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            docker build -t ${{ env.IMAGE_NAME }}:${VERSION} -t ${{ env.IMAGE_NAME }}:latest .
          else
            docker build -t ${{ env.IMAGE_NAME }}:latest .
          fi

      - name: Redéploiement automatique du conteneur
        run: |
          if [ -d "/mnt/stockage_raid/AppData/MULTI-IA-AETHAS38" ]; then
            cd /mnt/stockage_raid/AppData/MULTI-IA-AETHAS38
            docker compose up -d --force-recreate aethas38-core
          fi
          docker image prune -f