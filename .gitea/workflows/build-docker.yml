name: Build, Push Registry & Deploy AETHAS38

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: 192.168.1.20:3000
  IMAGE_NAME: xavier/multi-ia-codage

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Validation syntaxique Backend Python & Frontend HTML
        run: |
          python3 validate_project.py

      - name: Connexion au registre Gitea et Publication du Paquet
        run: |
          # Correction : Désactivation explicite du socket TLS pour forcer le HTTP local pur
          unset DOCKER_TLS_VERIFY
          unset DOCKER_HOST
          unset DOCKER_CERT_PATH

          # Connexion au registre Gitea local (192.168.1.20:3000)
          echo "${{ secrets.GITEA_TOKEN || gitea.token }}" | docker login ${{ env.REGISTRY }} -u ${{ gitea.actor }} --password-stdin

          # Construction et Push du paquet
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGGED_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
            LATEST_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            
            docker build -t ${TAGGED_IMAGE} -t ${LATEST_IMAGE} .
            docker push ${TAGGED_IMAGE}
            docker push ${LATEST_IMAGE}
          else
            LATEST_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            docker build -t ${LATEST_IMAGE} .
            docker push ${LATEST_IMAGE}
          fi

      - name: Mise à jour locale sur le serveur hôte
        run: |
          if [ -d "/mnt/stockage_raid/AppData/MULTI-IA-AETHAS38" ]; then
            cd /mnt/stockage_raid/AppData/MULTI-IA-AETHAS38
            docker compose pull aethas38-core
            docker compose up -d --force-recreate aethas38-core
          fi
          docker image prune -f