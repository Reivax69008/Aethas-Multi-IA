name: Deploiement Automatique Aethas38
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest  # Correspond au libellé exact de votre capture Gitea
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Synchronisation sur le serveur et redémarrage Dockge
        run: |
          cd /opt/stacks/codage
          git pull origin main
          docker compose restart aethas38-core