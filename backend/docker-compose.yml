services:
  aethas38-core:
    build: .
    container_name: aethas38-multi-ia
    restart: unless-stopped
    ports:
      - "5002:5001"
    environment:
      - TZ=Europe/Paris
    env_file:
      - .env
    extra_hosts:
      - host.docker.internal:host-gateway
    command: uvicorn main:app --host 0.0.0.0 --port 5001 --reload
    volumes:
      - /mnt/stockage_raid/AppData/MULTI-IA-AETHAS38/sessions:/app/sessions
      - /mnt/stockage_raid/AppData/MULTI-IA-AETHAS38/logs:/app/logs
      - /mnt/stockage_raid/AppData/MULTI-IA-AETHAS38/history.json:/app/history.json
    networks:
      - dockge-network

networks:
  dockge-network:
    external: true