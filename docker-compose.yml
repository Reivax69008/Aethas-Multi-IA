services:
  aethas38-db:
    image: postgres:15-alpine
    container_name: aethas38-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: aethas38
    volumes:
      - /mnt/stockage_raid/AppData/MULTI-IA-AETHAS38/postgres_data:/var/lib/postgresql/data
    networks:
      - dockge-network

  aethas38-core:
    image: gitea.aethas38.duckdns.org/xavier/multi-ia-codage:latest
    container_name: aethas38-multi-ia
    restart: unless-stopped
    ports:
      - "5002:5001"
    environment:
      - TZ=Europe/Paris
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@aethas38-db:5432/aethas38
    env_file:
      - .env
    depends_on:
      - aethas38-db
    volumes:
      - /mnt/stockage_raid/AppData/MULTI-IA-AETHAS38/sessions:/app/sessions
      - /mnt/stockage_raid/AppData/MULTI-IA-AETHAS38/logs:/app/logs
    networks:
      - dockge-network

networks:
  dockge-network:
    external: true